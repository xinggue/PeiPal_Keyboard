name: Build ESP32 Firmware

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ESP32-C3 & ESP32-S3 Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Cache ESP32 Core
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages/esp32
            ~/.arduino15/package_esp32_index.json
          key: ${{ runner.os }}-esp32-core-v3

      - name: Install ESP32 Board Core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compile ESP32-C3 Firmware
        run: |
          mkdir -p build/esp32c3
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3:CDCOnBoot=cdc \
            firmware_c3/firmware_c3.ino \
            --output-dir build/esp32c3

      - name: Compile ESP32-S3 Firmware
        run: |
          mkdir -p build/esp32s3
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,USBMode=default \
            firmware_s3/firmware_s3.ino \
            --output-dir build/esp32s3

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-binaries
          path: build/

      - name: Publish Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/esp32c3/*.bin
            build/esp32s3/*.bin
